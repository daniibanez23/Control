<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Presencia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Control de Presencia</h1>

    <!-- ===== ALTA DE TRABAJADORES ===== -->
    <section class="card">
        <h2>Alta de Trabajador</h2>
        <form id="formTrabajador">
            <input type="text" id="dni" placeholder="DNI" required>
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="tel" id="telefono" placeholder="Teléfono" required>
            <input type="email" id="correo" placeholder="Correo" required>
            <button type="submit">Guardar Trabajador</button>
        </form>
    </section>

    <!-- ===== REGISTRO DE PRESENCIA ===== -->
    <section class="card">
        <h2>Registrar Presencia</h2>
        <form id="formPresencia">
            <input type="text" id="dniPresencia" placeholder="DNI" required>
            <input type="date" id="fecha" required>
            <input type="time" id="hora" required>
            <button type="submit">Registrar Entrada</button>
        </form>
    </section>

    <script src="app.js"></script>
</body>
</html>
<!-- ===== VER LISTADOS ===== -->
<section class="card">
    <h2>Listados</h2>
    <button id="verListados">Mostrar Trabajadores y Registros</button>

    <h3>Trabajadores</h3>
    <table id="tablaTrabajadores">
        <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h3>Registros de Presencia</h3>
    <table id="tablaPresencias">
        <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Hora</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>
